[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoverblade-fm"
version = "0.1.0"
description = "End-to-end hover-only rotor generator with blunt trailing edge hard constraint and Figure-of-Merit maximization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HoverBlade-FM contributors" }]
keywords = ["rotor", "hover", "airfoil", "cst", "bem", "optimization", "cfd-free"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "matplotlib>=3.8",
  "cma>=3.3",
]

[project.optional-dependencies]
cad = ["cadquery>=2.5 ; python_version < '3.13'", "ezdxf>=1.3"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-setuptools",
]

[project.scripts]
hoverblade-fm = "hoverblade_fm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoverblade_fm"]
artifacts = ["src/hoverblade_fm/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long running optimisation tests",
  "cad: tests that require a CAD kernel",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
