# Documentation build check (计划.md T096 / 第 14.5 节 build-docs).
# Build only: deployment is intentionally out of scope here, because gh-pages setup is a
# repository-settings action that must be a deliberate decision.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  HOVERBLADE_FM_OFFLINE: "1"
  UV_LINK_MODE: copy

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          cache: true
          cache-dependency-path: uv.lock

      - name: Sync with the docs extra
        run: uv sync --extra docs

      # --strict turns warnings (broken nav entries, missing includes) into failures.
      - name: Build
        run: uv run mkdocs build --strict

      - name: Sanity-check generated pages
        run: |
          test -s site/index.html
          test -s site/user_guide/index.html
          test -s site/developer_guide/index.html
          test -s site/disclaimer/index.html

      - name: Upload site artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
          if-no-files-found: error
          retention-days: 7
